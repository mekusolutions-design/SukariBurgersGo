services:
  - type: web
    name: restflow-api
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: restflow-db
          property: connectionString
      - key: BASE_URL
        sync: false
      - key: MPESA_ENV
        value: sandbox
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

  - type: worker
    name: restflow-worker
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile.worker
    dockerContext: .
    dockerCommand: /app/restflow-worker run
    envVars:
      - key: NODE_ENV
        value: production
      - key: RESTFLOW_ROLE
        value: worker
      - key: WORKER_MAX_CONNS
        value: "3"
      - key: DATABASE_URL
        fromDatabase:
          name: restflow-db
          property: connectionString

databases:
  - name: restflow-db
    plan: basic-256mb
    databaseName: restflow
    user: restflow
